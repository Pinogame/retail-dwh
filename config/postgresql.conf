# --- CONNECTION SETTINGS ---
# Allow connections from anywhere (required for Docker)
listen_addresses = '*'
max_connections = 100

# --- MEMORY TUNING (Production Ready) ---
# Shared memory for caching data (std: 25% of RAM)
shared_buffers = 256MB

# Memory per operation (sort/hash) before spilling to disk
work_mem = 8MB

# --- LOGGING ---
# Log queries slower than 500ms (to identify slow queries - Optimization)
log_min_duration_statement = 500ms